# Amplify Gen 2 build for the monorepo: the app and its backend live in app/.
version: 1
applications:
  - appRoot: app
    backend:
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
        build:
          commands:
            - npm install --no-audit --no-fund --cache .npm --prefer-offline
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            # The Evidence page serves the recorded gate reports from the repository.
            - mkdir -p public/reports && cp ../reports/gate-*.json ../reports/gate-*.md public/reports/
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
