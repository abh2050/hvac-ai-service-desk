[project]
name = "uptime-desk"
version = "0.1.0"
description = "AI service desk for HVAC maintenance in critical buildings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6",
    "pypdf>=5",
    "boto3>=1.35",
    "botocore[crt]>=1.35",
    "xgboost>=3.4.1",
    "scikit-learn>=1.9.1",
    "ortools>=9.15.6755",
    "psycopg[binary]>=3.3.6",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false
