# CONFIGURATION, NOT DATA.
# Decision policy thresholds. Deterministic code reads these values. Gate reports record
# the values in force for each run.

detection:
  # Owner decision after Gate 1 (2026-10-22): rules are the primary detector. The model runs
  # beside them on every unit. When rules and model disagree, the case goes to manager review.
  # The model is trained locally (pipelines/training/train_detector.py), not on SageMaker,
  # and its artifact ships with the detection Lambda.
  primary: rules
  second_opinion: model
  min_confidence: 0.70            # below this, the case goes to manual review and is not diagnosed
  require_review_on_disagreement: true

diagnosis:
  min_citations: 1                # zero supported citations -> "insufficient evidence"
  require_exact_manual_match: false   # class match -> "compatibility uncertain" flag, not a block
  deterministic_match_min_token_overlap: 0.6
  entailment_required: true

work_order:
  block_if_required_safety_step_unsourced: true
  approval_timeout_hours: 4       # Step Functions task token timeout; expiry escalates the order

mcp:
  audit_denied_calls: true
